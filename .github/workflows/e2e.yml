name: E2E tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-web:
    name: Browser flows (TC-FL-001, 002, 004, 005)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the application
        working-directory: .
        env:
          # The backend refuses to start in production without these. Google
          # sign-in is not exercised, so placeholders are enough.
          GOOGLE_CLIENT_ID: e2e-placeholder
          GOOGLE_CLIENT_SECRET: e2e-placeholder
        run: docker compose up --build --detach --wait db backend frontend

      - name: Wait for the frontend and API
        run: |
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 http://localhost:3001/api/health
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 --output /dev/null http://localhost:8080

      - name: Run Playwright tests
        run: npx playwright test --project=web

      - name: Show container logs
        if: failure()
        working-directory: .
        run: docker compose logs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-results
          if-no-files-found: ignore
          path: |
            e2e/results/
            e2e/playwright-report/
            e2e/test-results/

  e2e-agent:
    name: Desktop agent (TC-FL-003)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      E2E_BASE_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            frontend/package-lock.json

      - name: Build the desktop agent
        working-directory: desktop-agent
        run: cargo build --release --locked

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install test dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium

      # A single step, because the runner stops background processes when the
      # step that started them ends.
      - name: Start the agent and the frontend, then run Playwright tests
        run: |
          Start-Process -FilePath "$PWD\desktop-agent\target\release\focuslock-agent.exe" `
            -RedirectStandardOutput "$PWD\agent.log" -RedirectStandardError "$PWD\agent.err.log"
          Start-Process -FilePath node -WorkingDirectory "$PWD\frontend" `
            -ArgumentList 'node_modules/vite/bin/vite.js', 'preview', '--port', '4173', '--strictPort'
          foreach ($url in 'http://127.0.0.1:7777/status', 'http://localhost:4173') {
            $deadline = (Get-Date).AddSeconds(60)
            while ($true) {
              try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 $url | Out-Null; break }
              catch {
                if ((Get-Date) -gt $deadline) { throw "$url did not start" }
                Start-Sleep -Seconds 1
              }
            }
          }
          Set-Location e2e
          npx playwright test --project=agent

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-agent-results
          if-no-files-found: ignore
          path: |
            agent.log
            agent.err.log
            e2e/results/
            e2e/playwright-report/
            e2e/test-results/
