services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: focus-lock-backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:8080
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: focus-lock-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
