services:
  db:
    image: postgres:16-alpine
    container_name: focus-lock-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-focuslock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-focuslock}
      POSTGRES_DB: ${POSTGRES_DB:-focuslock}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer:latest
    container_name: focus-lock-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: focus-lock-backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-focuslock}:${POSTGRES_PASSWORD:-focuslock}@db:5432/${POSTGRES_DB:-focuslock}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: focus-lock-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
