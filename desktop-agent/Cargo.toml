[package]
name = "focuslock-agent"
version = "0.1.0"
edition = "2021"
description = "Focus Lock desktop blocking agent"

[[bin]]
name = "focuslock-agent"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
sysinfo = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# Discovery (Start Menu shortcuts + icon extraction)
walkdir = "2"
lnk = "0.5"

[target.'cfg(windows)'.dependencies]
systemicons = "0.7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
