# Development override — run on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Frontend is served by Vite on http://localhost:5173 with HMR.
# Backend uses `tsx watch` and reloads on file changes.
# Source folders are bind-mounted; node_modules stays inside each container.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: focus-lock-backend-dev
    # Sync deps when package-lock changes (named node_modules volume can go stale)
    command: sh -c "npm ci && npm run dev"
    environment:
      PORT: 3001
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://${POSTGRES_USER:-focuslock}:${POSTGRES_PASSWORD:-focuslock}@db:5432/${POSTGRES_DB:-focuslock}
      RUN_MIGRATIONS_ON_START: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3001/api/auth/google/callback}
      FRONTEND_AUTH_CALLBACK_URL: ${FRONTEND_AUTH_CALLBACK_URL:-http://localhost:5173/auth/callback}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-jwt-secret-change-before-production-32+}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS:-30}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/package.json:/app/package.json
      - ./backend/package-lock.json:/app/package-lock.json
      - backend_node_modules:/app/node_modules
    ports: !override
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: focus-lock-frontend-dev
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_HMR_HOST: localhost
      VITE_API_URL: http://localhost:3001
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
      - frontend_node_modules:/app/node_modules
    ports: !override
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
